name: 编译与发布 AWEmbyPush 插件

on:
  push:
    tags:
      - 'v*' # 当推送 v 开头的 tag 时自动发布，比如 v1.5.4
  workflow_dispatch: # 允许手动点击运行

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 编译前端
        run: |
          cd plugins/awembypush
          npm install
          npm run build
          if [ ! -d "dist" ]; then
            echo "[Error] 前端构建完成后未找到 dist 目录"
            exit 1
          fi

      - name: 打包插件
        run: |
          # 创建打包目录
          mkdir -p release_package/awembypush
          
          # 将 Python 源码和必要文件考入
          cp plugins/awembypush/__init__.py release_package/awembypush/
          cp plugins/awembypush/logo.png release_package/awembypush/
          
          # 将编译好的 dist 目录拷入
          cp -r plugins/awembypush/dist release_package/awembypush/
          
          # 压缩打包
          cd release_package
          zip -r awembypush.zip awembypush/

      - name: 创建 GitHub 发布
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_package/awembypush.zip
          name: 发布 ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物 (手动运行)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: awembypush-plugin
          path: release_package/awembypush.zip
